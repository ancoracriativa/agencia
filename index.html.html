<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgênciaOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --g:#1D4A3F;--gl:#2a6557;--gd:#132f28;--gs:#1D4A3F12;--gm:#1D4A3F35;
  --gold:#C9A84C;--goldd:#a07a30;--goldl:#e2c06e;--golds:#C9A84C14;--goldm:#C9A84C30;
  --w:#fff;--off:#f9f7f2;--s:#f4f2ec;--s2:#edeae0;--b:#e5e1d4;--bl:#f0ede4;
  --t1:#18180f;--t2:#6b6254;--t3:#a09585;
  --red:#c0392b;--reds:#c0392b12;--orange:#e67e22;--oranges:#e67e2212;
  --blue:#2471a3;--blues:#2471a312;--purple:#7d3c98;--purples:#7d3c9812;
  --green2:#1e8449;--green2s:#1e844912;
  --sb:220px;--top:52px;--r:10px;--r2:14px;
  --shadow:0 2px 12px rgba(29,74,63,.07);
  --shadow2:0 4px 20px rgba(29,74,63,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;font-size:13px;color:var(--t1);background:var(--s)}
/* ── LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sb);background:var(--gd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;z-index:10}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--top);background:var(--w);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;padding:0 22px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:22px;background:var(--s)}
/* ── SIDEBAR ── */
.sb-logo{padding:14px 16px 12px;border-bottom:1px solid rgba(201,168,76,.12);cursor:pointer;position:relative}
.sb-logo:hover .logo-edit-hint{opacity:1}
.logo-edit-hint{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.8);opacity:0;transition:opacity .2s;border-radius:0;pointer-events:none}
.sb-logo-img{max-height:36px;max-width:160px;object-fit:contain;display:block}
.sb-logo-txt{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--gold);letter-spacing:.3px}
.sb-logo-sub{font-size:9px;color:rgba(201,168,76,.4);letter-spacing:1.2px;text-transform:uppercase;margin-top:1px}
/* collaborators */
.collab-card{background:var(--w);border:1px solid var(--b);border-radius:var(--r2);padding:16px;transition:all .15s}
.collab-card:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.collab-av-lg{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:'Syne',sans-serif;flex-shrink:0}
.role-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:10.5px;font-weight:600}
.role-admin{background:var(--golds);color:var(--goldd)}.role-gestor{background:var(--gs);color:var(--g)}.role-colaborador{background:var(--s2);color:var(--t2)}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-nav::-webkit-scrollbar{width:3px}.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.nav-sec{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:rgba(201,168,76,.35);padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:all .14s;color:rgba(255,255,255,.5);font-size:12.5px;margin-bottom:1px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.nav-item.active{background:rgba(201,168,76,.16);color:var(--gold);font-weight:500}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--gold);color:var(--gd);font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center}
.sb-user{padding:10px 12px;border-top:1px solid rgba(201,168,76,.1);display:flex;align-items:center;gap:8px}
.u-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldd));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gd);flex-shrink:0}
.u-name{font-size:11.5px;font-weight:500;color:rgba(255,255,255,.75)}
.u-role{font-size:9.5px;color:rgba(201,168,76,.45)}
/* ── TOPBAR ── */
.tb-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--g)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-wrap{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:0 10px;height:32px;width:190px;transition:all .15s}
.search-wrap:focus-within{background:var(--w);border-color:var(--gm);width:220px}
.search-wrap input{border:none;background:transparent;font-size:12px;color:var(--t1);outline:none;flex:1;font-family:'Inter',sans-serif}
.search-wrap input::placeholder{color:var(--t3)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .14s;border:none;font-family:'Inter',sans-serif}
.btn-p{background:var(--g);color:var(--w)}.btn-p:hover{background:var(--gl)}
.btn-g{background:transparent;color:var(--t2);border:1px solid var(--b)}.btn-g:hover{background:var(--s2)}
.btn-gold{background:var(--gold);color:var(--gd);font-weight:600}.btn-gold:hover{background:var(--goldl)}
.btn-danger{background:var(--reds);color:var(--red);border:1px solid rgba(192,57,43,.2)}.btn-danger:hover{background:rgba(192,57,43,.18)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--b);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:all .14s;position:relative}
.btn-icon:hover{background:var(--s2)}
.notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--gold);border-radius:50%;border:1.5px solid var(--w)}
/* ── PAGES ── */
.page{display:none;animation:fadeIn .18s ease-out}.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* ── CARDS / SURFACES ── */
.card{background:var(--w);border:1px solid var(--b);border-radius:var(--r2);overflow:hidden}
.card-hd{padding:13px 17px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--g)}
.card-body{padding:16px 17px}
.card-action{font-size:11px;color:var(--gold);cursor:pointer;font-weight:500;transition:opacity .12s}
.card-action:hover{opacity:.75;text-decoration:underline}
.gold-line{width:28px;height:3px;background:var(--gold);border-radius:3px;margin-bottom:14px}
/* ── STAT CARDS ── */
.stats-row{display:grid;gap:12px;margin-bottom:18px}
.stat-card{background:var(--w);border:1px solid var(--b);border-radius:var(--r2);padding:15px 17px;position:relative;overflow:hidden;transition:box-shadow .14s;cursor:default}
.stat-card:hover{box-shadow:var(--shadow)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--g));border-radius:var(--r2) var(--r2) 0 0}
.stat-lbl{font-size:10.5px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.stat-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:var(--g);margin:5px 0 2px;line-height:1}
.stat-sub{font-size:11px;display:flex;align-items:center;gap:3px}
.up{color:var(--green2)}.dn{color:var(--red)}.neutral{color:var(--t3)}
/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;font-size:10.5px;font-weight:500;white-space:nowrap}
.tag-g{background:var(--green2s);color:var(--green2)}.tag-gold{background:var(--golds);color:var(--goldd)}
.tag-r{background:var(--reds);color:var(--red)}.tag-b{background:var(--blues);color:var(--blue)}
.tag-o{background:var(--oranges);color:var(--orange)}.tag-gr{background:var(--s2);color:var(--t2)}
.tag-p{background:var(--purples);color:var(--purple)}.tag-teal{background:#0d7a6a12;color:#0d7a6a}
/* ── TABLES ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:0 10px 9px;border-bottom:1px solid var(--b)}
.tbl td{padding:9px 10px;font-size:12px;border-bottom:1px solid var(--bl);color:var(--t2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--s)}
/* ── CHIPS ── */
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:500;cursor:pointer;border:1px solid var(--b);background:var(--w);color:var(--t2);transition:all .12s;user-select:none}
.chip:hover{border-color:var(--gm);color:var(--g)}
.chip.active{background:var(--g);color:var(--w);border-color:var(--g)}
/* ── KANBAN ── */
.kanban{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;min-height:360px}
.kanban::-webkit-scrollbar{height:5px}.kanban::-webkit-scrollbar-thumb{background:var(--b);border-radius:5px}
.kb-col{flex-shrink:0;width:200px;background:var(--s2);border:1px solid var(--b);border-radius:var(--r);padding:9px;display:flex;flex-direction:column;gap:6px}
.kb-col-hd{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.kb-col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kb-col-title{font-size:11px;font-weight:600;color:var(--t2);flex:1;text-transform:uppercase;letter-spacing:.4px}
.kb-col-cnt{font-size:9.5px;color:var(--t3);background:var(--b);padding:1px 5px;border-radius:6px}
.kb-card{background:var(--w);border:1px solid var(--b);border-radius:8px;padding:9px 11px;cursor:pointer;transition:all .13s}
.kb-card:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(201,168,76,.15);transform:translateY(-1px)}
.kb-card-title{font-size:12px;font-weight:500;color:var(--t1);line-height:1.4}
.kb-card-client{font-size:10.5px;color:var(--t3);margin:3px 0}
.kb-card-ft{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.priority{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.p-hi{background:var(--red)}.p-md{background:var(--orange)}.p-lo{background:var(--green2)}
.due{font-size:10px;color:var(--t3)}.due.late{color:var(--red);font-weight:600}
/* ── PROGRESS ── */
.prog-wrap{height:5px;background:var(--b);border-radius:5px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:5px;background:var(--g);transition:width .3s}
/* ── AVATARS ── */
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.av-sm{width:20px;height:20px;font-size:8px}
/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--w);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2);transform:translateY(10px);transition:transform .2s}
.modal-bg.open .modal{transform:translateY(0)}
.modal::-webkit-scrollbar{width:4px}.modal::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
.modal-hd{padding:18px 20px 14px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--g)}
.modal-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--b);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);transition:all .12s}
.modal-close:hover{background:var(--s2)}
.modal-body{padding:18px 20px}
.modal-ft{padding:12px 20px;border-top:1px solid var(--bl);display:flex;align-items:center;justify-content:flex-end;gap:8px}
/* ── FORMS ── */
.form-row{display:grid;gap:12px;margin-bottom:12px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:500;color:var(--t2)}
.field input,.field select,.field textarea{border:1px solid var(--b);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--t1);background:var(--w);outline:none;transition:border-color .14s;font-family:'Inter',sans-serif;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gm)}
.field textarea{resize:vertical;min-height:70px}
.field select{cursor:pointer}
/* ── GRID LAYOUTS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
/* ── ACTIVITY ── */
.act-item{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--bl)}
.act-item:last-child{border-bottom:none}
.act-icon{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.act-text{font-size:12px;color:var(--t2);line-height:1.5}
.act-text strong{color:var(--t1);font-weight:500}
.act-time{font-size:10.5px;color:var(--t3);margin-top:1px}
/* ── CLIENT CARD ── */
.client-card{background:var(--w);border:1px solid var(--b);border-radius:var(--r2);padding:16px;cursor:pointer;transition:all .15s}
.client-card:hover{border-color:var(--gold);box-shadow:var(--shadow2);transform:translateY(-1px)}
/* ── HEALTH BAR ── */
.health-row{display:flex;align-items:center;gap:6px;margin:6px 0}
.health-bar{flex:1;height:4px;background:var(--b);border-radius:4px;overflow:hidden}
.health-fill{height:100%;border-radius:4px}
/* ── SCROLLBAR ── */
.content::-webkit-scrollbar{width:5px}.content::-webkit-scrollbar-thumb{background:var(--b);border-radius:5px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:5px}
/* ── IA CARD ── */
.ia-block{background:var(--gd);border-radius:var(--r2);padding:18px;color:var(--w);position:relative;overflow:hidden;margin-bottom:14px}
.ia-block::before{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:rgba(201,168,76,.08)}
.ia-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--gold);margin-bottom:4px}
.ia-sub{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:12px}
.ia-tag{display:inline-block;padding:3px 9px;background:rgba(201,168,76,.15);color:var(--goldl);border-radius:10px;font-size:10.5px;font-weight:500;margin:2px;border:1px solid rgba(201,168,76,.12)}
/* ── SECTION HEADER ── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--g)}
/* ── INPUT GROUP ── */
.input-group{display:flex;align-items:center;gap:1px}
.input-group input{border-radius:8px 0 0 8px;flex:1}
.input-group button{border-radius:0 8px 8px 0;padding:9px 14px;border:1px solid var(--b);border-left:none;background:var(--s2);color:var(--t2);cursor:pointer;font-size:12px;white-space:nowrap;transition:all .13s}
.input-group button:hover{background:var(--b)}
/* ── APPROVAL CARD ── */
.appr-card{background:var(--w);border:1px solid var(--b);border-radius:var(--r2);overflow:hidden;transition:box-shadow .13s}
.appr-card:hover{box-shadow:var(--shadow)}
.appr-preview{height:110px;display:flex;align-items:center;justify-content:center;font-size:30px;border-bottom:1px solid var(--bl);position:relative}
.appr-info{padding:11px 13px}
/* ── FINANCIAL BAR CHART ── */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:8px 0}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;cursor:pointer;transition:opacity .13s}
.bar:hover{opacity:.8}
.bar-lbl{font-size:9.5px;color:var(--t3);text-align:center}
.bar-val{font-size:9px;color:var(--t2);font-weight:500;text-align:center}
/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{font-size:9px;font-weight:600;color:var(--t3);text-align:center;letter-spacing:.3px;padding:2px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;cursor:pointer;transition:all .12s;color:var(--t2);position:relative;user-select:none}
.cal-day:hover{background:var(--s2)}
.cal-day.today{background:var(--g);color:var(--w);font-weight:600}
.cal-day.has-ev::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cal-day.other{color:var(--t3);opacity:.4}
/* ── ONBOARDING CHECKLIST ── */
.ob-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--s);border-radius:8px;margin-bottom:6px}
.ob-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--b);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .13s}
.ob-check.done{background:var(--g);border-color:var(--g)}
.ob-check.done::after{content:'✓';color:var(--w);font-size:9px}
input[list]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}
input[list]{cursor:text}
.tooltip-wrap{position:relative;display:inline-flex}
.tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--t1);color:var(--w);font-size:10.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:50}
.tooltip-wrap:hover .tooltip{opacity:1}
/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--t3);gap:8px}
.empty-icon{font-size:32px;opacity:.4}
.empty-text{font-size:13px;text-align:center}
/* ── DIVIDER ── */
.divider{height:1px;background:var(--bl);margin:12px 0}
/* notification panel */
.notif-panel{position:fixed;top:var(--top);right:0;width:320px;background:var(--w);border-left:1px solid var(--b);border-bottom:1px solid var(--b);border-radius:0 0 0 12px;z-index:50;box-shadow:var(--shadow2);transform:translateX(100%);transition:transform .2s}
.notif-panel.open{transform:translateX(0)}
.notif-panel-hd{padding:14px 16px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between}
.notif-panel-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--g)}
.notif-row{display:flex;align-items:flex-start;gap:9px;padding:10px 16px;border-bottom:1px solid var(--bl);cursor:pointer;transition:background .12s}
.notif-row:hover{background:var(--s)}
.notif-row:last-child{border-bottom:none}
.notif-row-icon{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px}
.notif-row-title{font-size:12px;font-weight:500;color:var(--t1);line-height:1.4}
.notif-row-time{font-size:10.5px;color:var(--t3);margin-top:2px}
.notif-unread-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:5px}
/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--g);color:var(--w);padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:500;z-index:200;transform:translateY(60px);opacity:0;transition:all .25s;box-shadow:var(--shadow2);display:flex;align-items:center;gap:8px;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--green2)}.toast.error{background:var(--red)}.toast.warning{background:var(--orange)}
/* ── DETAIL HEADER ── */
.detail-hd{background:var(--g);border-radius:var(--r2);padding:18px 20px;color:var(--w);margin-bottom:16px;display:flex;align-items:center;gap:14px}
.detail-logo{width:48px;height:48px;border-radius:10px;background:rgba(201,168,76,.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:'Syne',sans-serif;color:var(--gold);flex-shrink:0}
.detail-name{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--w)}
.detail-sub{font-size:11.5px;color:rgba(255,255,255,.55);margin-top:2px}
.detail-stats{display:flex;gap:18px;margin-left:auto}
.ds-val{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--gold)}
.ds-lbl{font-size:10px;color:rgba(255,255,255,.4);text-align:center}
/* ── AI LOADING ── */
.ai-loading{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:12px;padding:12px 0}
.ai-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dot-pulse 1.2s infinite;margin:0 2px}
.ai-dots span:nth-child(2){animation-delay:.2s}.ai-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
/* ── STRATEGY AREA ── */
.strategy-block{background:var(--s);border:1px solid var(--bl);border-radius:10px;padding:13px;margin-bottom:10px}
.strategy-block h4{font-size:11.5px;font-weight:600;color:var(--g);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.strategy-tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:10.5px;margin:2px;background:var(--w);border:1px solid var(--b);color:var(--t2);cursor:pointer}
.strategy-tag:hover{border-color:var(--gm);color:var(--g)}
/* ── PIPELINE STAGE INDICATOR ── */
.stage-bar{display:flex;gap:2px;margin-bottom:16px}
.stage-step{flex:1;height:4px;border-radius:2px;background:var(--b);transition:background .2s}
.stage-step.done{background:var(--g)}.stage-step.current{background:var(--gold)}
/* ── RESPONSIVE HELPERS ── */
.row{display:flex;gap:14px;margin-bottom:14px}.col{flex:1;min-width:0}
.mt-0{margin-top:0}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-0{margin-bottom:0}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.text-sm{font-size:11.5px}.text-xs{font-size:10.5px}.text-muted{color:var(--t3)}.text-green{color:var(--g)}.text-gold{color:var(--goldd)}.text-red{color:var(--red)}
.font-medium{font-weight:500}.font-bold{font-weight:600}
.w-full{width:100%}
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-logo" onclick="triggerLogoUpload()" title="Clique para trocar o logo">
      <div id="logo-display">
        <div class="sb-logo-txt" id="sb-logo-txt">AgênciaOS</div>
        <div class="sb-logo-sub" id="sb-logo-sub">Sistema Operacional</div>
      </div>
      <div class="logo-edit-hint">📷 Trocar logo</div>
      <input type="file" id="logo-file-input" accept="image/*" style="display:none" onchange="handleLogoUpload(event)">
    </div>
    <nav class="sb-nav" id="sidebar-nav">
      <div class="nav-sec">Principal</div>
      <div class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </div>
      <div class="nav-sec">Comercial</div>
      <div class="nav-item" data-page="crm" id="nav-crm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        CRM / Leads
        <span class="nav-badge" id="badge-crm">0</span>
      </div>
      <div class="nav-sec">Clientes</div>
      <div class="nav-item" data-page="clientes" id="nav-clientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Clientes Ativos
        <span class="nav-badge" id="badge-clientes" style="background:var(--g);color:var(--w)">0</span>
      </div>
      <div class="nav-sec">Produção</div>
      <div class="nav-item" data-page="conteudo" id="nav-conteudo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Produção
        <span class="nav-badge" id="badge-conteudo">0</span>
      </div>
      <div class="nav-item" data-page="aprovacao" id="nav-aprovacao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Aprovações
        <span class="nav-badge" id="badge-aprovacao">0</span>
      </div>
      <div class="nav-sec">Gestão</div>
      <div class="nav-item" data-page="colaboradores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Colaboradores
      </div>
      <div class="nav-item" data-page="tarefas" id="nav-tarefas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tarefas
        <span class="nav-badge" id="badge-tarefas" style="background:var(--red);">0</span>
      </div>
      <div class="nav-item" data-page="financeiro" id="nav-financeiro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Financeiro
      </div>
      <div class="nav-item" data-page="ia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="3" fill="currentColor" opacity=".3"/></svg>
        Inteligência IA
      </div>
      <div class="nav-item" data-page="relatorios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Relatórios
      </div>
      <div class="nav-item" data-page="config">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Configurações
      </div>
    </nav>
    <div class="sb-user">
      <div class="u-av" id="sb-user-av">GS</div>
      <div><div class="u-name" id="sb-user-name">Gestor</div><div class="u-role">Administrador</div></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-title" id="topbar-title">Dashboard</div>
      <div class="tb-right">
        <div class="search-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="global-search" type="text" placeholder="Buscar clientes, tarefas...">
        </div>
        <button class="btn btn-g" onclick="openModal('lead')">+ Lead</button>
        <button class="btn btn-p" onclick="openModal('conteudo')">+ Conteúdo</button>
        <div class="btn-icon" id="notif-btn" onclick="toggleNotifPanel()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <div class="notif-dot" id="notif-dot"></div>
        </div>
      </div>

    <div class="content" id="content-area">
      <!-- Pages rendered here by JS -->
    </div>
  </div>
</div>

<!-- NOTIFICATION PANEL -->
<div class="notif-panel" id="notif-panel">
  <div class="notif-panel-hd">
    <div class="notif-panel-title">Notificações</div>
    <button class="btn btn-g btn-sm" onclick="markAllRead()">Marcar lidas</button>
  </div>
  <div id="notif-list"></div>
</div>

<!-- MODALS -->
<div class="modal-bg" id="modal-bg" onclick="handleModalBgClick(event)">
  <div class="modal" id="modal-content"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  STATE & STORAGE
// ═══════════════════════════════════════════════
const STORE_KEY = 'agencia_os_v3';

const DEFAULT_NICHES = ['Estética','Saúde','Fitness','Gastronomia','Moda','Tecnologia','Imóveis','Educação','Jurídico','Pet Care','Beleza','Odontologia','Nutrição','Psicologia'];
function getNiches(){
  const custom = state.config.customNiches || [];
  return [...new Set([...DEFAULT_NICHES, ...custom])].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function addCustomNicho(nicho){
  if(!nicho || DEFAULT_NICHES.includes(nicho)) return;
  if(!state.config.customNiches) state.config.customNiches = [];
  if(!state.config.customNiches.includes(nicho)){
    state.config.customNiches.push(nicho);
    saveState();
  }
}
function removeNicho(nicho){
  if(!state.config.customNiches) return;
  state.config.customNiches = state.config.customNiches.filter(n=>n!==nicho);
  saveState(); renderPage('config'); toast('Nicho removido');
}
// Renders a free-text input with datalist autocomplete for nicho
function nichoInput(currentValue='', inputId='f-nicho'){
  const listId = inputId+'-list';
  const opts = getNiches().map(n=>`<option value="${n}">`).join('');
  return `
<input id="${inputId}" list="${listId}" value="${currentValue||''}" placeholder="Digite ou escolha o nicho..." autocomplete="off"
  style="border:1px solid var(--b);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--t1);background:var(--w);outline:none;width:100%;font-family:'Inter',sans-serif;transition:border-color .14px"
  onfocus="this.style.borderColor='var(--gm)'" onblur="this.style.borderColor='var(--b)'">
<datalist id="${listId}">${opts}</datalist>`;}
const ORIGENS = ['Instagram','Indicação','Google','Facebook','LinkedIn','Site','Evento','Outro'];
const CARGOS = ['Gestor de Conteúdo','Designer','Editor de Vídeo','Social Media','Atendimento','Comercial','Financeiro','Diretor','Estagiário','Outro'];
const NIVEIS_ACESSO = ['Admin','Gestor','Colaborador'];
const DEFAULT_RESPONSAVEIS = ['Ana Carolina','Pedro Lima','Maria Santos','Carlos Ferreira','Gestor'];
function getResponsaveis(){ 
  const fromCollab = state.colaboradores.filter(c=>c.ativo!==false).map(c=>c.nome);
  return fromCollab.length > 0 ? fromCollab : DEFAULT_RESPONSAVEIS;
}
const ETAPAS_CRM = ['Lead Entrou','Primeiro Contato','Reunião Agendada','Reunião Realizada','Proposta Enviada','Follow-up','Fechado','Perdido','Retomar Depois'];
const ETAPAS_PROD = ['Ideias','Pesquisa','Roteiro','Revisão','Gravação','Edição','Revisão Final','Aprovação Cliente','Agendado','Postado'];
const TIPOS_CONTEUDO = ['Reels','Carrossel','Feed','Story','TikTok','YouTube','Email','Blog'];
const PLATAFORMAS = ['Instagram','TikTok','YouTube','LinkedIn','Facebook','Email','Site'];
const PRIORIDADES = ['Alta','Média','Baixa'];
const STATUS_FIN = ['Pendente','Pago','Atrasado','Cancelado'];

const ETAPAS_PROD_COLORS = {
  'Ideias':'#95a5a6','Pesquisa':'#3498db','Roteiro':'#8e44ad','Revisão':'#e67e22',
  'Gravação':'#c0392b','Edição':'#e67e22','Revisão Final':'#f39c12','Aprovação Cliente':'#C9A84C',
  'Agendado':'#27ae60','Postado':'#1D4A3F'
};

let state = {
  leads:[],clientes:[],conteudos:[],tarefas:[],financeiros:[],insights:[],
  notifications:[],activities:[],colaboradores:[],
  config:{agencyName:'Minha Agência',userName:'Gestor',logoData:null},
  currentClienteId:null, currentPage:'dashboard'
};

async function loadState(){
  try {
    const r = await window.storage.get(STORE_KEY);
    if(r && r.value){ const s = JSON.parse(r.value); Object.assign(state,s); }
  } catch(e){ /* first run */ }
}

async function saveState(){
  try { await window.storage.set(STORE_KEY, JSON.stringify(state)); } catch(e){}
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function addActivity(icon, bg, msg){
  state.activities.unshift({icon,bg,msg,time:new Date().toISOString()});
  if(state.activities.length>50) state.activities.length=50;
}

function addNotification(icon, bg, title, detail='', type='info'){
  state.notifications.unshift({id:uid(),icon,bg,title,detail,type,read:false,time:new Date().toISOString()});
  updateNotifBadge();
}

function updateNotifBadge(){
  const unread = state.notifications.filter(n=>!n.read).length;
  const dot = document.getElementById('notif-dot');
  if(dot) dot.style.display = unread>0?'block':'none';
}

// ═══════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════
let toastTimer;
function toast(msg, type='success'){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show '+(type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'),3000);
}

// ═══════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════
const PAGE_TITLES = {
  dashboard:'Dashboard Geral',crm:'CRM — Pipeline Comercial',clientes:'Clientes Ativos',
  'cliente-detalhe':'Área do Cliente',conteudo:'Pipeline de Produção',
  aprovacao:'Central de Aprovações',tarefas:'Gestão de Tarefas',
  financeiro:'Gestão Financeira',ia:'Inteligência de Conteúdo — IA',
  colaboradores:'Colaboradores da Agência',
  relatorios:'Relatórios',config:'Configurações'
};

function navigate(page, extra={}){
  state.currentPage = page;
  if(extra.clienteId !== undefined) state.currentClienteId = extra.clienteId;

  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nav = document.querySelector(`[data-page="${page}"]`) || document.querySelector(`[data-page="clientes"]`);
  if(nav) nav.classList.add('active');

  const title = page==='cliente-detalhe'
    ? (getCliente(state.currentClienteId)?.nome || 'Cliente') + ' — Área do Cliente'
    : PAGE_TITLES[page]||page;
  document.getElementById('topbar-title').textContent = title;
  renderPage(page);
  updateBadges();
}

document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click',()=>navigate(n.dataset.page));
});

// ═══════════════════════════════════════════════
//  BADGES
// ═══════════════════════════════════════════════
function updateBadges(){
  const leads = state.leads.filter(l=>!['Fechado','Perdido'].includes(l.stage)).length;
  const el = document.getElementById('badge-crm');
  if(el){ el.textContent=leads; el.style.display=leads>0?'':'none'; }

  const cl = document.getElementById('badge-clientes');
  if(cl){ cl.textContent=state.clientes.filter(c=>c.status==='Ativo').length; }

  const late = state.tarefas.filter(t=>t.status!=='Concluída'&&t.prazo&&new Date(t.prazo)<new Date()).length;
  const bt = document.getElementById('badge-tarefas');
  if(bt){ bt.textContent=late; bt.style.display=late>0?'':'none'; }

  const pend = state.conteudos.filter(c=>c.etapa==='Aprovação Cliente').length;
  const ba = document.getElementById('badge-aprovacao');
  if(ba){ ba.textContent=pend; ba.style.display=pend>0?'':'none'; }

  const prod = state.conteudos.filter(c=>!['Postado'].includes(c.etapa)).length;
  const bc = document.getElementById('badge-conteudo');
  if(bc){ bc.textContent=prod; bc.style.display=prod>0?'':'none'; }
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function getLead(id){ return state.leads.find(l=>l.id===id); }
function getCliente(id){ return state.clientes.find(c=>c.id===id); }
function getConteudo(id){ return state.conteudos.find(c=>c.id===id); }
function getTarefa(id){ return state.tarefas.find(t=>t.id===id); }
function getFinanceiro(id){ return state.financeiros.find(f=>f.id===id); }

function fmt(n){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0}).format(n||0); }
function fmtDate(d){ if(!d) return '—'; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString('pt-BR'); }
function isLate(d){ if(!d) return false; return new Date(d+'T23:59:59') < new Date(); }
function initials(nome){ if(!nome) return '??'; return nome.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function getAv(nome,color='var(--gm)',textColor='var(--g)'){
  return `<div class="av" style="background:${color};color:${textColor}">${initials(nome)}</div>`;
}
function healthColor(pct){ if(pct>=75) return 'var(--green2)'; if(pct>=45) return 'var(--orange)'; return 'var(--red)'; }
function healthTag(pct){
  if(pct>=75) return '<span class="tag tag-g">Saudável</span>';
  if(pct>=45) return '<span class="tag tag-o">Atenção</span>';
  return '<span class="tag tag-r">Risco</span>';
}

function calcMRR(){ return state.clientes.filter(c=>c.status==='Ativo').reduce((a,c)=>a+(c.mensalidade||0),0); }
function calcInadim(){ return state.financeiros.filter(f=>f.status==='Atrasado').reduce((a,f)=>a+(f.valor||0),0); }
function countLate(){ return state.tarefas.filter(t=>t.status!=='Concluída'&&t.prazo&&isLate(t.prazo)).length; }
function countPendingApproval(){ return state.conteudos.filter(c=>c.etapa==='Aprovação Cliente').length; }

// ═══════════════════════════════════════════════
//  MODAL SYSTEM
// ═══════════════════════════════════════════════
function openModal(type, data={}){
  const bg = document.getElementById('modal-bg');
  const content = document.getElementById('modal-content');
  content.innerHTML = getModalHTML(type, data);
  bg.classList.add('open');
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
}
function handleModalBgClick(e){
  if(e.target===document.getElementById('modal-bg')) closeModal();
}

// ═══════════════════════════════════════════════
//  MODAL HTML GENERATORS
// ═══════════════════════════════════════════════
function getModalHTML(type, data){
  switch(type){
    case 'lead': return modalLead(data);
    case 'cliente': return modalCliente(data);
    case 'conteudo': return modalConteudo(data);
    case 'tarefa': return modalTarefa(data);
    case 'financeiro': return modalFinanceiro(data);
    case 'colaborador': return modalColaborador(data);
    case 'config': return modalConfig();
    case 'lead-detail': return modalLeadDetail(data);
    default: return '<div class="modal-body">Modal não encontrado</div>';
  }
}

function modalLead(d={}){
  const edit = d.id?true:false;
  return `
<div class="modal-hd">
  <div class="modal-title">${edit?'Editar Lead':'Novo Lead'}</div>
  <button class="modal-close" onclick="closeModal()">✕</button>
</div>
<div class="modal-body">
  <div class="form-row cols-2">
    <div class="field"><label>Nome *</label><input id="f-nome" value="${d.nome||''}" placeholder="Nome completo"></div>
    <div class="field"><label>Nicho *</label>${nichoInput(d.nicho,'f-nicho')}</div>
  </div>
  <div class="form-row cols-2">
    <div class="field"><label>Instagram</label><input id="f-instagram" value="${d.instagram||''}" placeholder="@usuario"></div>
    <div class="field"><label>WhatsApp</label><input id="f-whatsapp" value="${d.whatsapp||''}" placeholder="(11) 99999-9999"></div>

function v(id){ return document.getElementById(id)?.value?.trim()||''; }

function saveLead(existingId){
  const nome = v('f-nome');
  if(!nome){ toast('Nome é obrigatório','error'); return; }
  const data = {
    id: existingId||uid(), nome, nicho:v('f-nicho')||'',
    instagram:v('f-instagram'), whatsapp:v('f-whatsapp'), origem:v('f-origem'),
    valorPotencial:parseFloat(v('f-valor'))||0, responsavel:v('f-responsavel'),
    stage:v('f-stage')||'Lead Entrou', observacoes:v('f-obs'),
    dataEntrada: existingId ? getLead(existingId)?.dataEntrada : new Date().toISOString()
  };
  addCustomNicho(data.nicho);
  if(existingId){ const i=state.leads.findIndex(l=>l.id===existingId); if(i>-1) state.leads[i]=data; }
  else { state.leads.push(data); addActivity('👤','var(--blues)','Novo lead: '+nome); }

  // Auto-convert if Fechado
  if(data.stage==='Fechado' && !state.clientes.find(c=>c.leadId===data.id)){
    autoCreateClienteFromLead(data);
  }
  saveState(); closeModal(); renderPage(state.currentPage); updateBadges();
  toast(existingId?'Lead atualizado!':'Lead adicionado!');
}

function autoCreateClienteFromLead(lead){
  const cId = uid();
  const cliente = {
    id:cId, leadId:lead.id, nome:lead.nome, nicho:lead.nicho,
    instagram:lead.instagram, whatsapp:lead.whatsapp,
    status:'Onboarding',
    mensalidade:lead.valorPotencial||0, vencimento:15,
    dataInicio:new Date().toISOString(),
    observacoes:'Cliente criado automaticamente via CRM.',
    cores:[], drive:'', metaAds:'', senhas:{}
  };
  state.clientes.push(cliente);
  // Create onboarding tasks
  const onboardingTasks = [
    'Criar grupo WhatsApp e pasta no Drive','Solicitar acessos (Instagram, Meta Ads)',
    'Enviar formulário de onboarding','Reunião de briefing inicial',
    'Pesquisa de mercado e concorrência','Planejamento editorial do 1º mês'
  ];
  onboardingTasks.forEach((titulo,i)=>{
    const d = new Date(); d.setDate(d.getDate()+i+1);
    state.tarefas.push({id:uid(),clienteId:cId,titulo,responsavel:lead.responsavel,
      prioridade:'Alta',prazo:d.toISOString().slice(0,10),status:'Pendente',observacoes:'Onboarding'});
  });
  // Create first financial charge
  const venc = new Date(); venc.setDate(15);
  if(venc < new Date()) venc.setMonth(venc.getMonth()+1);
  state.financeiros.push({id:uid(),clienteId:cId,valor:lead.valorPotencial||0,
    vencimento:venc.toISOString().slice(0,10),status:'Pendente',observacoes:'1ª mensalidade'});

  addNotification('🎉','var(--green2s)','Lead convertido! Cliente criado automaticamente',cliente.nome,'success');
  addActivity('🎉','var(--green2s)','Lead "'+lead.nome+'" convertido em cliente!');
  toast('🎉 Lead convertido! Cliente e onboarding criados automaticamente.','success');
}

function deleteLead(id){
  if(!confirm('Excluir este lead?')) return;
  state.leads = state.leads.filter(l=>l.id!==id);
  saveState(); renderPage(state.currentPage); updateBadges(); toast('Lead excluído');
}

function saveCliente(existingId){
  const nome = v('f-nome');
  if(!nome){ toast('Nome é obrigatório','error'); return; }
  const existing = existingId ? getCliente(existingId) : {};
  const data = {
    ...(existing||{}), id:existingId||uid(), nome, nicho:v('f-nicho'),
    instagram:v('f-instagram'), whatsapp:v('f-whatsapp'),
    mensalidade:parseFloat(v('f-mensalidade'))||0, vencimento:parseInt(v('f-vencimento'))||15,
    status:v('f-status')||'Ativo',
    drive:v('f-drive'), metaAds:v('f-metaads'),
    observacoes:v('f-obs'),
    dataInicio:existing?.dataInicio||new Date().toISOString()
  };
  addCustomNicho(data.nicho);
  if(existingId){ const i=state.clientes.findIndex(c=>c.id===existingId); if(i>-1) state.clientes[i]=data; }
  else { state.clientes.push(data); addActivity('👥','var(--golds)','Novo cliente: '+nome); }
  saveState(); closeModal(); renderPage(state.currentPage); updateBadges();
  toast(existingId?'Cliente atualizado!':'Cliente criado!');
}

  if(!confirm('Excluir este cliente e todos os dados relacionados?')) return;
  state.clientes = state.clientes.filter(c=>c.id!==id);
  state.conteudos = state.conteudos.filter(c=>c.clienteId!==id);
  state.tarefas = state.tarefas.filter(t=>t.clienteId!==id);
  state.financeiros = state.financeiros.filter(f=>f.clienteId!==id);

  const titulo = v('f-titulo'); const clienteId = v('f-clienteId');
  if(!titulo){ toast('Título é obrigatório','error'); return; }
  const data = {
    id:existingId||uid(), titulo, clienteId, tipo:v('f-tipo'),
    plataforma:v('f-plataforma'), etapa:v('f-etapa')||'Ideias',
    responsavel:v('f-responsavel'), prioridade:v('f-prioridade')||'Média',
    prazo:v('f-prazo'), dataPostagem:v('f-dataPostagem'),
    legenda:v('f-legenda'), cta:v('f-cta'), referencias:v('f-referencias'),
    comentarios:existingId?getConteudo(existingId)?.comentarios||[]:[]
  };
  if(existingId){ const i=state.conteudos.findIndex(c=>c.id===existingId); if(i>-1) state.conteudos[i]=data; }
  else { state.conteudos.push(data); addActivity('📸','var(--purples)','Novo conteúdo: '+titulo); }

function moveConteudo(id, novaEtapa){
  const c = getConteudo(id); if(!c) return;
  const oldEtapa = c.etapa; c.etapa = novaEtapa;
  if(novaEtapa==='Aprovação Cliente'){
    addNotification('📋','var(--golds)','Aprovação necessária: '+c.titulo, getCliente(c.clienteId)?.nome||'','warning');
  }
  if(novaEtapa==='Postado'){
    addActivity('✅','var(--green2s)',`"${c.titulo}" foi postado!`);
  }
  saveState(); renderPage(state.currentPage); updateBadges(); toast(`Movido para: ${novaEtapa}`);
}

function approveConteudo(id){
  const c = getConteudo(id); if(!c) return;
  c.etapa = 'Agendado'; c.aprovado = true;
  addActivity('✅','var(--green2s)',`Conteúdo aprovado: ${c.titulo}`);
  saveState(); renderPage(state.currentPage); updateBadges(); toast('Conteúdo aprovado! Movido para Agendado.','success');
}

function rejectConteudo(id){
  const c = getConteudo(id); if(!c) return;
  const motivo = prompt('Motivo da reprovação:');
  if(motivo===null) return;
  c.etapa = 'Revisão Final'; c.motivoRejeicao = motivo;
  addActivity('🔄','var(--reds)',`Conteúdo reprovado e devolvido: ${c.titulo}`);
  saveState(); renderPage(state.currentPage); updateBadges(); toast('Conteúdo reprovado. Devolvido para revisão.','warning');
}

function deleteConteudo(id){
  if(!confirm('Excluir este conteúdo?')) return;
  state.conteudos = state.conteudos.filter(c=>c.id!==id);
  saveState(); renderPage(state.currentPage); updateBadges(); toast('Conteúdo excluído');
}

function saveTarefa(existingId){
  const titulo = v('f-titulo');
  if(!titulo){ toast('Título é obrigatório','error'); return; }
  const data = {
    id:existingId||uid(), titulo, clienteId:v('f-clienteId'),
    responsavel:v('f-responsavel'), prioridade:v('f-prioridade')||'Média',
    prazo:v('f-prazo'), status:v('f-status')||'Pendente', observacoes:v('f-obs')
  };
  if(existingId){ const i=state.tarefas.findIndex(t=>t.id===existingId); if(i>-1) state.tarefas[i]=data; }
  else { state.tarefas.push(data); addActivity('✅','var(--green2s)','Nova tarefa: '+titulo); }
  saveState(); closeModal(); renderPage(state.currentPage); updateBadges();
  toast(existingId?'Tarefa atualizada!':'Tarefa criada!');
}

function toggleTarefa(id){
  const t = getTarefa(id); if(!t) return;
  t.status = t.status==='Concluída' ? 'Pendente' : 'Concluída';
  if(t.status==='Concluída') addActivity('✅','var(--green2s)','Tarefa concluída: '+t.titulo);
  saveState(); renderPage(state.currentPage); updateBadges(); toast(t.status==='Concluída'?'Tarefa concluída!':'Tarefa reaberta');
}

function deleteTarefa(id){
  if(!confirm('Excluir esta tarefa?')) return;
  state.tarefas = state.tarefas.filter(t=>t.id!==id);
  saveState(); renderPage(state.currentPage); updateBadges(); toast('Tarefa excluída');
}

function saveFinanceiro(existingId){
  const clienteId = v('f-clienteId'); const valor = parseFloat(v('f-valor'));
  if(!clienteId||!valor){ toast('Cliente e valor são obrigatórios','error'); return; }
  const data = {
    id:existingId||uid(), clienteId, valor, vencimento:v('f-vencimento'),
    status:v('f-status')||'Pendente', dataPagamento:v('f-dataPagamento'), observacoes:v('f-obs')
  };
  if(existingId){ const i=state.financeiros.findIndex(f=>f.id===existingId); if(i>-1) state.financeiros[i]=data; }
  else { state.financeiros.push(data); }
  if(data.status==='Pago') addActivity('💰','var(--golds)','Pagamento recebido: '+fmt(valor));
  saveState(); closeModal(); renderPage(state.currentPage);
  toast(existingId?'Cobrança atualizada!':'Cobrança criada!');
}

function deleteFinanceiro(id){
  if(!confirm('Excluir esta cobrança?')) return;
  state.financeiros = state.financeiros.filter(f=>f.id!==id);
  saveState(); renderPage(state.currentPage); toast('Cobrança excluída');
}

function saveConfig(){
  state.config.agencyName = v('f-agencyName')||'Minha Agência';
  state.config.userName = v('f-userName')||'Gestor';
  document.getElementById('sb-user-name').textContent = state.config.userName;
  document.getElementById('sb-user-av').textContent = initials(state.config.userName);
  document.querySelector('.sb-logo-txt').textContent = state.config.agencyName||'AgênciaOS';
  saveState(); closeModal(); toast('Configurações salvas!');
}

function clearData(){
  state.leads=[]; state.clientes=[]; state.conteudos=[]; state.tarefas=[];
  state.financeiros=[]; state.insights=[]; state.activities=[]; state.notifications=[];
  saveState(); closeModal(); renderPage(state.currentPage); updateBadges(); toast('Dados limpos!','warning');
}

function updateLeadStage(id, newStage){
  const l = getLead(id); if(!l) return;
  const old = l.stage;
  l.stage = newStage;
  if(newStage==='Fechado' && old!=='Fechado' && !state.clientes.find(c=>c.leadId===id)){
    autoCreateClienteFromLead(l);
  }
  saveState(); renderPage(state.currentPage); updateBadges();
  toast('Estágio atualizado: '+newStage);
}

function updateClienteField(id, field, value){
  const c = getCliente(id); if(!c) return;
  c[field] = value;
  saveState();
}

function toggleNotifPanel(){
  const p = document.getElementById('notif-panel');
  p.classList.toggle('open');
  if(p.classList.contains('open')) renderNotifPanel();
}

function renderNotifPanel(){
  const list = document.getElementById('notif-list');
  if(!state.notifications.length){
    list.innerHTML='<div class="empty" style="padding:24px"><span class="text-xs text-muted">Nenhuma notificação</span></div>';
    return;
  }
  list.innerHTML = state.notifications.slice(0,12).map(n=>`
    <div class="notif-row" onclick="readNotif('${n.id}')">
      <div class="notif-row-icon" style="background:${n.bg||'var(--s2)'}">${n.icon||'🔔'}</div>
      <div style="flex:1">
        <div class="notif-row-title">${n.title}</div>
        ${n.detail?`<div class="text-xs text-muted">${n.detail}</div>`:''}
        <div class="notif-row-time">${timeAgo(n.time)}</div>
      </div>
      ${!n.read?'<div class="notif-unread-dot"></div>':''}
    </div>`).join('');
}

function readNotif(id){
  const n = state.notifications.find(x=>x.id===id); if(n) n.read=true;
  saveState(); updateNotifBadge(); renderNotifPanel();
}

function markAllRead(){
  state.notifications.forEach(n=>n.read=true);
  saveState(); updateNotifBadge(); renderNotifPanel(); toast('Todas marcadas como lidas');
}

function timeAgo(iso){
  if(!iso) return '';
  const diff = (Date.now()-new Date(iso).getTime())/1000;
  if(diff<60) return 'agora';
  if(diff<3600) return `há ${Math.floor(diff/60)} min`;
  if(diff<86400) return `há ${Math.floor(diff/3600)}h`;
  return `há ${Math.floor(diff/86400)} dias`;
}

function renderPage(page){
  const el = document.getElementById('content-area');
  switch(page){
    case 'dashboard': el.innerHTML = pageDashboard(); break;
    case 'crm': el.innerHTML = pageCRM(); break;
    case 'clientes': el.innerHTML = pageClientes(); break;
    case 'cliente-detalhe': el.innerHTML = pageClienteDetalhe(state.currentClienteId); break;
    case 'conteudo': el.innerHTML = pageConteudo(); break;
    case 'aprovacao': el.innerHTML = pageAprovacao(); break;
    case 'tarefas': el.innerHTML = pageTarefas(); break;
    case 'financeiro': el.innerHTML = pageFinanceiro(); break;
    case 'ia': el.innerHTML = pageIA(); break;
    case 'colaboradores': el.innerHTML = pageColaboradores(); break;
    case 'config': el.innerHTML = pageConfig(); break;
    default: el.innerHTML = `<div class="empty"><div class="empty-icon">🚧</div><div class="empty-text">Módulo em construção</div></div>`;
  }
}

    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    const total = state.financeiros.filter(f=>f.status==='Pago'&&f.dataPagamento&&f.dataPagamento.startsWith(key)).reduce((a,f)=>a+(f.valor||0),0);

  const recentActivities = state.activities.slice(0,6);

<div class="g4 mb-16" style="grid-template-columns:repeat(4,1fr)">
  <div class="stat-card" style="--accent:var(--gold)">

    <div class="stat-lbl">Clientes Ativos</div>
    <div class="stat-val">${activeClients}</div>

  </div>
  <div class="stat-card" style="--accent:${lateCount>0?'var(--red)':'var(--green2)'}">
    <div class="stat-lbl">Tarefas Atrasadas</div>
    <div class="stat-val" style="color:${lateCount>0?'var(--red)':'var(--g)'}">${lateCount}</div>
    <div class="stat-sub ${lateCount>0?'dn':'neutral'}">${lateCount>0?'Ação necessária':'Em dia'}</div>
  </div>
  <div class="stat-card" style="--accent:${pendingApproval>0?'var(--orange)':'var(--g)'}">
    <div class="stat-lbl">Aprovações Pendentes</div>
    <div class="stat-val" style="color:${pendingApproval>0?'var(--orange)':'var(--g)'}">${pendingApproval}</div>
    <div class="stat-sub neutral">Aguardando clientes</div>

</div>

<div class="row">
  <div class="col" style="flex:1.4">
    <div class="card mb-16">
      <div class="card-hd"><div class="card-title">Faturamento Mensal</div><span class="card-action" onclick="navigate('financeiro')">Ver tudo →</span></div>
      <div class="card-body">
        <div class="bar-chart">
          ${months.map((m,i)=>`
          <div class="bar-wrap">
            <div class="bar" style="height:${Math.max(8,Math.round((m.total/maxBar)*110))}px;background:${i===5?'var(--g)':'var(--gm)'};" title="${fmt(m.total)}"></div>
            <div class="bar-lbl" style="${i===5?'color:var(--g);font-weight:600;':''}">${m.label}</div>

          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bl)">

  </div>
</div>`;
}

      'Fechado':'var(--green2)','Perdido':'var(--red)','Follow-up':'var(--orange)',
      'Proposta Enviada':'var(--gold)','Reunião Realizada':'var(--purple)'

    const dotColor = colorMap[stage]||'#95a5a6';
    return `

    <div class="kb-col-dot" style="background:${dotColor}"></div>
    <span class="kb-col-title">${stage}</span>

function renderCRMKanban(filter){

function clienteCard(c){
  const tarefasPend = state.tarefas.filter(t=>t.clienteId===c.id&&t.status!=='Concluída').length;
  const conteudosPend = state.conteudos.filter(ct=>ct.clienteId===c.id&&ct.etapa!=='Postado').length;
  const finAtrasado = state.financeiros.some(f=>f.clienteId===c.id&&f.status==='Atrasado');

function pageClienteDetalhe(id){
  const c = getCliente(id);
  if(!c) return `<div class="empty"><div class="empty-icon">😕</div><div class="empty-text">Cliente não encontrado</div><button class="btn btn-g" onclick="navigate('clientes')">← Voltar</button></div>`;

  const tab = document.__cd_tab||'overview';
  const tarefas = state.tarefas.filter(t=>t.clienteId===id);
  const conteudos = state.conteudos.filter(ct=>ct.clienteId===id);
  const fins = state.financeiros.filter(f=>f.clienteId===id);
  const statusTag = {Ativo:'tag-g',Onboarding:'tag-b',Pausado:'tag-o',Encerrado:'tag-r'}[c.status]||'tag-gr';

  const totalPago = fins.filter(f=>f.status==='Pago').reduce((a,f)=>a+(f.valor||0),0);
  const conteudosPostados = conteudos.filter(ct=>ct.etapa==='Postado').length;

  let tabContent = '';
  if(tab==='overview'){
    const tarefasPend = tarefas.filter(t=>t.status!=='Concluída').slice(0,5);
    const contRecentes = conteudos.slice(0,5);
    tabContent = `
<div class="row">
  <div class="col">
    <div class="card mb-16">
      <div class="card-hd"><div class="card-title">Tarefas</div><button class="btn btn-g btn-sm" onclick="openModal('tarefa',{clienteId:'${id}'})">+ Nova</button></div>
      <div class="card-body" style="padding:6px 0">
        ${tarefasPend.length===0?'<div class="empty" style="padding:16px"><span class="text-xs text-muted">Sem tarefas pendentes ✅</span></div>':''}
        ${tarefasPend.map(t=>`
        <div style="display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--bl)">
          <div class="ob-check ${t.status==='Concluída'?'done':''}" onclick="toggleTarefa('${t.id}')"></div>
          <div style="flex:1">
            <div class="text-sm ${t.status==='Concluída'?'text-muted':'font-medium'}" style="${t.status==='Concluída'?'text-decoration:line-through':''}">${t.titulo}</div>
            <div class="text-xs text-muted">${t.responsavel} · <span class="${t.prazo&&isLate(t.prazo)&&t.status!=='Concluída'?'text-red':''}">${t.prazo?fmtDate(t.prazo):'Sem prazo'}</span></div>
          </div>
          <div style="display:flex;gap:3px">
            <button class="btn btn-g btn-sm" style="padding:3px 7px;font-size:10px" onclick="openModal('tarefa',${JSON.stringify(t).replace(/"/g,'&quot;')})">✏️</button>
            <button class="btn btn-danger btn-sm" style="padding:3px 7px;font-size:10px" onclick="deleteTarefa('${t.id}')">🗑</button>
          </div>
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><div class="card-title">Conteúdos Recentes</div><span class="card-action" onclick="document.__cf_cliente='${id}';navigate('conteudo')">Ver todos →</span></div>
      <div class="card-body" style="padding:6px 0">
        ${contRecentes.length===0?'<div class="empty" style="padding:16px"><span class="text-xs text-muted">Nenhum conteúdo criado ainda</span></div>':''}
        ${contRecentes.map(ct=>`
        <div style="display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--bl)">
          <div class="text-xs text-muted" style="width:14px;height:14px;border-radius:50%;background:${ETAPAS_PROD_COLORS[ct.etapa]||'#ccc'};flex-shrink:0"></div>
          <div style="flex:1">
            <div class="text-sm font-medium" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">${ct.titulo}</div>
            <div class="text-xs text-muted">${ct.tipo||'—'} · ${ct.etapa}</div>
          </div>
          <span class="tag ${ct.prioridade==='Alta'?'tag-r':ct.prioridade==='Média'?'tag-o':'tag-g'}" style="font-size:9.5px">${ct.prioridade||'—'}</span>
          ${ct.prazo?`<span class="due ${isLate(ct.prazo)&&ct.etapa!=='Postado'?'late':''}">${fmtDate(ct.prazo)}</span>`:''}
        </div>`).join('')}
      </div>
    </div>
  </div>
  <div class="col" style="flex:.65">
    <div class="card mb-16">
      <div class="card-hd"><div class="card-title">Informações</div><button class="btn btn-g btn-sm" onclick="openModal('cliente',${JSON.stringify(c).replace(/"/g,'&quot;')})">Editar</button></div>
      <div class="card-body" style="padding:0">
        ${[
          ['📱 Instagram', c.instagram?`<a href="https://instagram.com/${c.instagram.replace('@','')}" style="color:var(--blue)">${c.instagram}</a>`:'—'],
          ['📞 WhatsApp', c.whatsapp||'—'],
          ['📁 Drive', c.drive?`<a href="${c.drive}" target="_blank" style="color:var(--blue)">Abrir pasta ↗</a>`:'—'],
          ['🎯 Meta Ads', c.metaAds||'—'],
          ['📅 Início', c.dataInicio?fmtDate(c.dataInicio.slice(0,10)):'—'],
          ['💰 Mensalidade', fmt(c.mensalidade||0)],
          ['📅 Vencimento', `Todo dia ${c.vencimento||15}`],
        ].map(([lbl,val])=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--bl)">
          <span class="text-xs text-muted">${lbl}</span>
          <span class="text-sm">${val}</span>
        </div>`).join('')}
        ${c.observacoes?`<div style="padding:10px 14px;font-size:11.5px;color:var(--t2)">${c.observacoes}</div>`:''}
      </div>
    </div>
    <div class="card mb-16">
      <div class="card-hd"><div class="card-title">Financeiro</div><button class="btn btn-g btn-sm" onclick="openModal('financeiro',{clienteId:'${id}'})">+ Cobrança</button></div>
      <div class="card-body" style="padding:6px 0">
        ${fins.slice(0,4).map(f=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--bl)">
          <div>
            <div class="text-sm font-medium">${fmt(f.valor||0)}</div>
            <div class="text-xs text-muted">${f.vencimento?fmtDate(f.vencimento):'—'}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="tag ${{Pago:'tag-g',Pendente:'tag-gold',Atrasado:'tag-r',Cancelado:'tag-gr'}[f.status]||'tag-gr'}">${f.status}</span>
            <button class="btn btn-g btn-sm" style="padding:3px 7px;font-size:10px" onclick="openModal('financeiro',${JSON.stringify(f).replace(/"/g,'&quot;')})">✏️</button>
          </div>
        </div>`).join('')||'<div class="empty" style="padding:12px"><span class="text-xs text-muted">Nenhuma cobrança</span></div>'}
        <div style="padding:10px 14px;display:flex;justify-content:space-between;border-top:1px solid var(--bl)">
          <span class="text-xs text-muted">Total recebido</span>
          <span class="text-sm font-bold text-green">${fmt(totalPago)}</span>
        </div>
      </div>
    </div>
  </div>
</div>`;
  } else if(tab==='estrategia'){
    tabContent = pageClienteEstrategia(c);
  } else if(tab==='briefing'){
    tabContent = pageClienteBriefing(c);
  } else if(tab==='ia'){
    tabContent = pageClienteIA(c);
  }

  return `
<button class="btn btn-g btn-sm" style="margin-bottom:12px" onclick="navigate('clientes')">← Voltar</button>
<div class="detail-hd">
  <div class="detail-logo">${initials(c.nome)}</div>
  <div>
    <div class="detail-name">${c.nome}</div>
    <div class="detail-sub">${c.nicho||'—'} · <span class="tag ${statusTag}" style="font-size:10px">${c.status}</span></div>
  </div>
  <div class="detail-stats">
    <div style="text-align:center"><div class="ds-val">${fmt(c.mensalidade||0)}</div><div class="ds-lbl">Mensalidade</div></div>
    <div style="text-align:center"><div class="ds-val">${conteudosPostados}</div><div class="ds-lbl">Postados</div></div>
    <div style="text-align:center"><div class="ds-val">${fmt(totalPago)}</div><div class="ds-lbl">Total recebido</div></div>
  </div>
  <div style="margin-left:12px;display:flex;gap:6px">
    <button class="btn btn-gold btn-sm" onclick="openModal('cliente',${JSON.stringify(c).replace(/"/g,'&quot;')})">✏️ Editar</button>
    <button class="btn btn-danger btn-sm" onclick="deleteCliente('${c.id}')">🗑</button>
  </div>
</div>
<div class="chips">
  <div class="chip ${tab==='overview'?'active':''}" onclick="document.__cd_tab='overview';renderPage('cliente-detalhe')">Visão Geral</div>
  <div class="chip ${tab==='briefing'?'active':''}" onclick="document.__cd_tab='briefing';renderPage('cliente-detalhe')">📋 Briefing</div>
  <div class="chip ${tab==='estrategia'?'active':''}" onclick="document.__cd_tab='estrategia';renderPage('cliente-detalhe')">Estratégia</div>
  <div class="chip ${tab==='ia'?'active':''}" onclick="document.__cd_tab='ia';renderPage('cliente-detalhe')">Inteligência IA</div>
</div>
${tabContent}`;
}

function pageClienteBriefing(c){
  const b = c.briefing || {};
  const preenchido = Object.values(b).filter(v=>v&&v.toString().trim()).length;
  const total = 30;
  const pct = Math.min(100, Math.round((preenchido/total)*100));

  return `
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
  <div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:4px">Briefing preenchido</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:200px;height:6px;background:var(--b);border-radius:6px;overflow:hidden">
        <div style="width:${pct}%;height:100%;border-radius:6px;background:${pct>=75?'var(--green2)':pct>=40?'var(--orange)':'var(--red)'};transition:width .3s"></div>
      </div>
      <span style="font-size:12px;font-weight:600;color:${pct>=75?'var(--green2)':pct>=40?'var(--orange)':'var(--red)'}">${pct}%</span>
    </div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-g btn-sm" onclick="clearBriefing('${c.id}')">🗑 Limpar</button>
    <button class="btn btn-p" onclick="saveBriefing('${c.id}')">💾 Salvar Briefing</button>
  </div>
</div>

function esc(v){ return (v||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function saveBriefing(id){
  const c = getCliente(id); if(!c) return;
  const fields = [
    'nomeFantasia','segmento','cidade','tempoMercado','site','outrosCanais','descricaoEmpresa',
    'produtos','produtoPrincipal','ticketMedio','diferenciaisProd','resultados',
    'genero','faixaEtaria','renda','localPublico','perfilCliente','doresPublico','desejosPublico','objecoes',
    'tomVoz','cores','fontes','manualMarca','evitar','referencias',
    'situacaoRedes','seguidores','trafegoPago','naoFuncionou','funcionou','frequencia',
    'objetivo','metaFaturamento','prazoResultado','concorrentes','sazonalidades','aprovador','observacoes','dataReuniao',
    'historiaCliente','momentoVirada','historiasClientes','depoimentos','provasSociais','bastidores','conteudosVirais','outrasHistorias'
  ];
  if(!c.briefing) c.briefing = {};
  fields.forEach(k=>{
    const el = document.getElementById('bf-'+k);
    if(el) c.briefing[k] = el.value;
  });
  addActivity('📋','var(--golds)','Briefing salvo: '+c.nome);
  saveState(); toast('Briefing salvo com sucesso!','success');
  renderPage('cliente-detalhe');
}

function clearBriefing(id){
  if(!confirm('Limpar todo o briefing deste cliente?')) return;
  const c = getCliente(id); if(!c) return;
  c.briefing = {};
  saveState(); renderPage('cliente-detalhe'); toast('Briefing limpo','warning');
}

async function generateInsights(clienteId, tipo){
  const c = getCliente(clienteId); if(!c) return;
  const resultArea = document.getElementById('ia-result-area');
  if(resultArea){
    resultArea.innerHTML = `<div class="ai-loading"><div class="ai-dots"><span></span><span></span><span></span></div>Gerando análise com IA para ${c.nome}...</div>` + resultArea.innerHTML;
  }

  const prompts = {
    tendencias: `Você é um especialista em marketing digital. Gere 5-8 tendências de conteúdo atuais para o nicho "${c.nicho||'geral'}". Seja específico, prático e direto. Inclua: formato, tema, por que está em alta e uma ideia de execução. Responda em português.`,
    ideias: `Você é um estrategista de conteúdo. Para o nicho "${c.nicho||'geral'}", gere 8-10 ideias criativas e práticas de conteúdo para Instagram. Para cada ideia inclua: título, formato (Reels/Carrossel/Feed/Story), objetivo e dica de execução. Responda em português.`,
    estrategia: `Você é um consultor de marketing digital. Crie uma estratégia de conteúdo para 1 mês para um cliente do nicho "${c.nicho||'geral'}". Inclua: distribuição de conteúdo, temas principais, pilares editoriais e métricas para acompanhar. Responda em português.`,
    relatorio: `Você é um analista de marketing. Gere um template de relatório mensal para um cliente do nicho "${c.nicho||'geral'}". Inclua: métricas de desempenho para acompanhar, análise de resultados, pontos de atenção e próximos passos. Responda em português.`
  };

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:1000,
        messages:[{role:'user',content:prompts[tipo]}]
      })
    });
    const data = await response.json();
    const text = data.content?.[0]?.text || 'Erro ao gerar conteúdo.';
    const insight = { id:uid(), clienteId, tipo, conteudo:text, data:new Date().toISOString() };
    state.insights.unshift(insight);
    saveState();
    addActivity('🤖','var(--golds)',`IA gerou ${tipo} para ${c.nome}`);
    navigate('cliente-detalhe');
    toast('Análise gerada com sucesso!','success');
  } catch(e){
    toast('Erro ao conectar com IA. Verifique a conexão.','error');
    renderPage('cliente-detalhe');
  }
}

async function generateGlobalInsight(tipo){
  const resultArea = document.getElementById('ia-global-result');
  if(resultArea) resultArea.innerHTML = `<div class="ai-loading"><div class="ai-dots"><span></span><span></span><span></span></div>Gerando análise global...</div>`;
  const nichos = [...new Set(state.clientes.map(c=>c.nicho).filter(Boolean))].join(', ') || 'marketing digital';
  const prompts = {
    tendencias:`Você é um especialista em marketing digital e redes sociais. Gere um relatório de tendências de conteúdo atual para agências de marketing que atendem os seguintes nichos: ${nichos}. Inclua tendências de formato, temas quentes e oportunidades. Responda em português, de forma prática e direta.`,
    ideias:`Crie 15 ideias de conteúdo criativas e virais para os nichos: ${nichos}. Formato JSON não precisa, apenas lista numerada clara com: ideia, formato e plataforma recomendada. Responda em português.`,
    algoritmo:`Explique como o algoritmo do Instagram está funcionando em 2025 e dê 10 dicas práticas para aumentar o alcance orgânico de posts. Foco em resultados para negócios locais. Responda em português.`
  };
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompts[tipo]}]})
    });
    const data = await response.json();
    const text = data.content?.[0]?.text||'Erro.';

function triggerLogoUpload(){
  document.getElementById('logo-file-input').click();
}

function handleLogoUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 500000){ toast('Imagem muito grande. Use até 500KB.','error'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const data = e.target.result;
    state.config.logoData = data;
    applyLogo(data);
    saveState();
    toast('Logo atualizado!','success');
  };
  reader.readAsDataURL(file);
}

function applyLogo(dataUrl){
  const logoDisplay = document.getElementById('logo-display');
  if(!logoDisplay) return;
  if(dataUrl){
    logoDisplay.innerHTML = `<img src="${dataUrl}" class="sb-logo-img" alt="Logo da agência">`;
  } else {
    logoDisplay.innerHTML = `
      <div class="sb-logo-txt" id="sb-logo-txt">${state.config.agencyName||'AgênciaOS'}</div>
      <div class="sb-logo-sub">Sistema Operacional</div>`;
  }
}

function removeLogo(){
  state.config.logoData = null;
  applyLogo(null);
  saveState();
  toast('Logo removido');
}

//  AUTOMATIONS CHECK
// ═══════════════════════════════════════════════
function checkAutomations(){
  const today = new Date();
  // Check late tasks
  state.tarefas.forEach(t=>{
    if(t.status!=='Concluída'&&t.prazo&&isLate(t.prazo)){
      const existing = state.notifications.find(n=>n.id==='late_'+t.id);
      if(!existing){
        addNotification('⚠️','var(--reds)','Tarefa atrasada: '+t.titulo,'Ação necessária','warning');
        state.notifications[0].id = 'late_'+t.id;
      }
    }
  });
  // Check pending approvals > 1 day
  state.conteudos.forEach(c=>{
    if(c.etapa==='Aprovação Cliente'){
      const existing = state.notifications.find(n=>n.id==='appr_'+c.id);
      if(!existing){
        addNotification('📋','var(--golds)','Aprovação pendente: '+c.titulo,getCliente(c.clienteId)?.nome||'','warning');
        state.notifications[0].id = 'appr_'+c.id;
      }
    }
  });
  // Check overdue payments
  state.financeiros.forEach(f=>{
    if(f.vencimento&&isLate(f.vencimento)&&f.status==='Pendente'){
      f.status='Atrasado';
      const existing = state.notifications.find(n=>n.id==='fin_'+f.id);
      if(!existing){
        const c=getCliente(f.clienteId);
        addNotification('💸','var(--reds)','Pagamento atrasado: '+(c?c.nome:'—'),fmt(f.valor||0),'error');
        state.notifications[0].id = 'fin_'+f.id;
      }
    }
  });
  updateNotifBadge();
}

//  INIT
// ═══════════════════════════════════════════════
async function init(){
  await loadState();
  seedData();
  checkAutomations();

  // Apply saved config
  if(state.config.agencyName){
    const txt = document.getElementById('sb-logo-txt');
    if(txt) txt.textContent = state.config.agencyName;
  }
  if(state.config.userName){
    document.getElementById('sb-user-name').textContent = state.config.userName;
    document.getElementById('sb-user-av').textContent = initials(state.config.userName);
  }
  // Restore logo if saved
  if(state.config.logoData){
    applyLogo(state.config.logoData);
  }

  // Wire sidebar logo file input
  const sidebarInput = document.getElementById('logo-file-input');
  if(sidebarInput) sidebarInput.addEventListener('change', handleLogoUpload);

  navigate('dashboard');
  updateNotifBadge();

  // Auto-check automations every 60s
  setInterval(checkAutomations, 60000);
}

init();
</script>
